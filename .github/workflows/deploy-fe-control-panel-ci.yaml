name: Deploy FE Control Panel

on:
  push:
    branches:
      - "main"
    paths:
      - "**/src/oneid/oneid-control-panel/**/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - uat
          - prod
          - io-uat
          - io-prod

jobs:
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.setmatrix.outputs.matrix }}

    steps:
      - name: Set Dynamic Env Matrix
        id: setmatrix
        run: |
          echo "github.ref ${GITHUB_REF}"
          echo "event name ${EVENT_NAME}"

          if [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
            if [ "${INPUTS_ENVIRONMENT}" == "prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}]}"
            elif [ "${INPUTS_ENVIRONMENT}" == "io-uat" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-uat\", \"region\":\"eu-south-1\", \"build_mode\":\"io-uat\"}]}"
            elif [ "${INPUTS_ENVIRONMENT}" == "io-prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\", \"build_mode\":\"io-prod\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\", \"build_mode\":\"io-prod\"}]}"
            else
              matrixStringifiedObject="{\"include\":[{\"environment\":\"${INPUTS_ENVIRONMENT}\", \"region\":\"eu-south-1\"}]}"
            fi
          else
            matrixStringifiedObject="{\"include\":[{\"environment\":\"dev\", \"region\":\"eu-south-1\"}, {\"environment\":\"uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}, {\"environment\":\"io-uat\", \"region\":\"eu-south-1\", \"build_mode\":\"io-uat\"}, {\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\", \"build_mode\":\"io-prod\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\", \"build_mode\":\"io-prod\"}]}"
          fi

          echo "matrix=$matrixStringifiedObject" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_ENVIRONMENT: ${{ github.event.inputs.environment }}

  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ needs.setup.outputs.matrix != '' }}
    needs: setup
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}-${{ matrix.region }}
      cancel-in-progress: false

    continue-on-error: false
    environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 https://github.com/actions/checkout/releases/tag/v5.0.0
      - name: Use Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 https://github.com/actions/setup-node/releases/tag/v5.0.0
        with:
          node-version: 20.x
      - name: Run yarn install, lint and test
        working-directory: src/oneid/oneid-control-panel
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn test:coverage
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            build_mode="$INPUTS_ENVIRONMENT"
          else
            build_mode="${MATRIX_BUILD_MODE:-$MATRIX_ENVIRONMENT}"
          fi
          yarn build --mode "$build_mode"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_ENVIRONMENT: ${{ github.event.inputs.environment }}
          MATRIX_ENVIRONMENT: ${{ matrix.environment }}
          MATRIX_BUILD_MODE: ${{ matrix.build_mode }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v6.0.0
        with:
          role-to-assume: ${{ vars.IAM_ROLE_DEPLOY_FE }}
          aws-region: ${{ matrix.region }}

      - name: Copy to S3
        run: |
          aws s3 sync dist s3://${ASSETS_CONTROL_PANEL_BUCKET_NAME}
        env:
          ASSETS_CONTROL_PANEL_BUCKET_NAME: ${{ vars.ASSETS_CONTROL_PANEL_BUCKET_NAME }}
        working-directory: src/oneid/oneid-control-panel
