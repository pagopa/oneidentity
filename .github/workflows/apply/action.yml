name: apply
description: "Run terraform apply"

inputs:
  region:
    required: false
    type: string
  working-directory:
    required: true
    type: string
  iam_role:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v6.0.0
      with:
        role-to-assume: ${{ inputs.iam_role }}
        aws-region: ${{ inputs.region }}

    - name: Read terraform version
      id: read-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "TERRAFORM_VERSION=`cat "$GITHUB_WORKSPACE/src/infra/.terraform-version"`" >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0 https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.0
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Package Lambda layers
      shell: bash
      run: ./scripts/package-lambda-layers.sh

    - name: Terraform Init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform init

    - name: Terraform Apply
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform apply -auto-approve
