name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment'
        type: choice
        required: true
        default: dev
        options:
        - dev
        - uat
        - prod
        - io-uat
        - io-prod

  push:
    branches:
      - 'main'
    paths:
      - 'src/infra/**/CHANGELOG.md'

defaults:
  run:
    shell: bash

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.setmatrix.outputs.matrix }}
      
    steps:
      - name: Set Dynamic Env Matrix
        id: setmatrix
        run: |
          echo "github.ref $GITHUB_REF"
          echo "event name $EVENT_NAME"
  
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            if [ "$INPUTS_ENVIRONMENT" == "prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-uat" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-uat\", \"region\":\"eu-south-1\", \"working_directory\":\"src/infra/oneid-io/uat/eu-south-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\", \"working_directory\":\"src/infra/oneid-io/prod/eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\", \"working_directory\":\"src/infra/oneid-io/prod/eu-central-1\"}]}"
            else
              matrixStringifiedObject="{\"include\":[{\"environment\":\"$INPUTS_ENVIRONMENT\", \"region\":\"eu-south-1\"}]}"
            fi
          else
              matrixStringifiedObject="{\"include\":[{\"environment\":\"dev\", \"region\":\"eu-south-1\"}, {\"environment\":\"uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}, {\"environment\":\"io-uat\", \"region\":\"eu-south-1\", \"working_directory\":\"src/infra/oneid-io/uat/eu-south-1\"}, {\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\", \"working_directory\":\"src/infra/oneid-io/prod/eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\", \"working_directory\":\"src/infra/oneid-io/prod/eu-central-1\"}]}"
          fi

          echo "matrix=$matrixStringifiedObject" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_ENVIRONMENT: ${{ github.event.inputs.environment }}

  terraform:
    name: terraform apply (${{ matrix.environment }} ${{ matrix.region }})
    if: ${{ needs.setup.outputs.matrix != '' }}
    runs-on: ubuntu-22.04
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
  
    environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
    env:
      WORKING_DIR: ${{ matrix.working_directory || format('src/infra/{0}/{1}', matrix.environment, matrix.region) }}
      AWS_REGION: ${{ matrix.region }}

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7 https://github.com/actions/checkout/releases/tag/v4.1.7

      - name: Apply
        uses: ./.github/workflows/apply
        with:
          working-directory: ${{ env.WORKING_DIR }}
          region: ${{ matrix.region }}
          iam_role: ${{ vars.IAM_ROLE_IAC }}
