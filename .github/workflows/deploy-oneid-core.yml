name: Deploy Oneid Core

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/deploy-oneid-core.yml"
      - "**/src/oneid/oneid-ecs-core/**/CHANGELOG.md"
      - "**/src/oneid/oneid-common/**/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - uat
          - prod
          - io-uat
          - io-prod
jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.setmatrix.outputs.matrix }}

    steps:
      - name: Set Dynamic Env Matrix
        id: setmatrix
        run: |
          echo "github.ref $GITHUB_REF"
          echo "event name $EVENT_NAME"


          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            if [ "$INPUTS_ENVIRONMENT" == "prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-uat" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-uat\", \"region\":\"eu-south-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\"}]}"
            else
              matrixStringifiedObject="{\"include\":[{\"environment\":\"$INPUTS_ENVIRONMENT\", \"region\":\"eu-south-1\"}]}"
            fi
          else
            matrixStringifiedObject="{\"include\":[{\"environment\":\"dev\", \"region\":\"eu-south-1\"}, {\"environment\":\"uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}, {\"environment\":\"io-uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\"}]}"
          fi

          echo "matrix=$matrixStringifiedObject" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_ENVIRONMENT: ${{ github.event.inputs.environment }}

  deploy:
    name: Deploy on ECS ${{ matrix.environment }}-${{ matrix.region }}
    if: ${{ needs.setup.outputs.matrix != '' }}
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}-${{ matrix.region }}
      cancel-in-progress: false

    continue-on-error: false
    environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
    env:
      AWS_REGION: ${{ matrix.region }}
      APP_NAME: ${{ fromJSON('{"dev":"oneid","uat":"oneid","prod":"oneid","io-uat":"oneid-io","io-prod/eu-south-1":"oneid-io","io-prod/eu-central-1":"oneid-io"}')[matrix.environment] }}
      ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p","io-uat":"u","io-prod/eu-south-1":"p","io-prod/eu-central-1":"p"}')[matrix.environment] }}
      REGION_SHORT: ${{ fromJSON('{"eu-south-1":"es-1","eu-central-1":"ec-1"}')[matrix.region] }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 https://github.com/actions/checkout/releases/tag/v5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v6.0.0
        with:
          role-to-assume: ${{ vars.IAM_ROLE_DEPLOY_ECS }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@261fc3d4806db1fa66a15cc11113c456db8870a7 # v2.1.0 https://github.com/aws-actions/amazon-ecr-login/releases/tag/v2.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0

      - name: Cache Docker layers
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 https://github.com/actions/cache/releases/tag/v5.0.0
        id: cache
        with:
          path: build-cache-core
          key: buildx-${{ env.APP_NAME }}-${{ env.ENV_SHORT }}-${{ hashFiles('src/oneid/oneid-ecs-core/pom.xml', 'src/oneid/oneid-common/pom.xml', 'src/oneid/pom.xml') }}
          restore-keys: |
            buildx-${{ env.APP_NAME }}-${{ env.ENV_SHORT }}-

      - name: inject buildx-qgs into docker
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0 https://github.com/reproducible-containers/buildkit-cache-dance/releases/tag/v3.4.0
        with:
          cache-map: |
            {
              "build-cache-core": {"target": "/tmp/.build-cache", "uid": "1001", "gid": "1001"}
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Set up Maven settings.xml
        shell: bash
        env:
          GH_TOKEN_READ_PACKAGES: ${{ secrets.GH_TOKEN_READ_PACKAGES }}
          GH_TOKEN_READ_PACKAGES_USER: ${{ secrets.GH_TOKEN_READ_PACKAGES_USER }}
        run: |
          cat <<EOF > "$RUNNER_TEMP/maven-settings.xml"
          <settings><servers><server><id>github</id><username>${GH_TOKEN_READ_PACKAGES_USER}</username><password>${GH_TOKEN_READ_PACKAGES}</password></server></servers></settings>
          EOF

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0 https://github.com/docker/build-push-action/releases/tag/v7.0.0
        with:
          context: ./src/oneid/
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml

          provenance: false
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          file: src/oneid/oneid-ecs-core/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition $APP_NAME-$REGION_SHORT-$ENV_SHORT-core  \
          --query taskDefinition > ./task-definition.json
          echo $(cat ./task-definition.json | jq 'del(
                  .taskDefinitionArn,
                  .requiresAttributes,
                  .compatibilities,
                  .revision,
                  .status,
                  .registeredAt,
                  .registeredBy
              )') > ./task-definition.json
        env:
          APP_NAME: ${{ env.APP_NAME }}
          REGION_SHORT: ${{ env.REGION_SHORT }}
          ENV_SHORT: ${{ env.ENV_SHORT }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@77954e213ba1f9f9cb016b86a1d4f6fcdea0d57e # v1.8.4 https://github.com/aws-actions/amazon-ecs-render-task-definition/releases/tag/v1.8.4
        with:
          task-definition: ./task-definition.json
          container-name: oneid-core
          image: "${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@fc8fc60f3a60ffd500fcb13b209c59d221ac8c8c # v2.6.1 https://github.com/aws-actions/amazon-ecs-deploy-task-definition/releases/tag/v2.6.1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.APP_NAME }}-${{ env.REGION_SHORT }}-${{ env.ENV_SHORT }}-core
          cluster: ${{ env.APP_NAME }}-${{ env.REGION_SHORT }}-${{ env.ENV_SHORT }}-ecs
          wait-for-service-stability: true

