name: Deploy Lambda cache-updater

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - "main"
    paths:
      - "**/src/oneid/oneid-lambda-cache-updater/**/CHANGELOG.md"
      - "**/src/oneid/oneid-common/**/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - uat
          - prod
          - io-uat
          - io-prod

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.setmatrix.outputs.matrix }}

    steps:
      - name: Set Dynamic Env Matrix
        id: setmatrix
        run: |
          echo "github.ref $GITHUB_REF"
          echo "event name $EVENT_NAME"

          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            if [ "$INPUTS_ENVIRONMENT" == "prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-uat" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-uat\", \"region\":\"eu-south-1\"}]}"
            elif [ "$INPUTS_ENVIRONMENT" == "io-prod" ]; then
              matrixStringifiedObject="{\"include\":[{\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\"}]}"
            else
              matrixStringifiedObject="{\"include\":[{\"environment\":\"$INPUTS_ENVIRONMENT\", \"region\":\"eu-south-1\"}]}"
            fi
          else
            matrixStringifiedObject="{\"include\":[{\"environment\":\"dev\", \"region\":\"eu-south-1\"}, {\"environment\":\"uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-south-1\"}, {\"environment\":\"prod\", \"region\":\"eu-central-1\"}, {\"environment\":\"io-uat\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-south-1\", \"region\":\"eu-south-1\"}, {\"environment\":\"io-prod/eu-central-1\", \"region\":\"eu-central-1\"}]}"
          fi

          echo "matrix=$matrixStringifiedObject" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_ENVIRONMENT: ${{ github.event.inputs.environment }}

  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 https://github.com/actions/checkout/releases/tag/v5.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0 https://github.com/actions/setup-java/releases/tag/v5.0.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Set up Maven settings.xml
        env:
          GH_TOKEN_READ_PACKAGES: ${{ secrets.GH_TOKEN_READ_PACKAGES }}
          GH_TOKEN_READ_PACKAGES_USER: ${{ secrets.GH_TOKEN_READ_PACKAGES_USER }}
        shell: bash
        run: |
          cat <<EOF > "$RUNNER_TEMP/maven-settings.xml"
          <settings><servers><server><id>github</id><username>${GH_TOKEN_READ_PACKAGES_USER}</username><password>${GH_TOKEN_READ_PACKAGES}</password></server></servers></settings>
          EOF

      - name: Build with Maven
        working-directory: src/oneid
        run: ./mvnw -f pom.xml -B package -DskipTests -P oneid-lambda-cache-updater-aggregate -s "$RUNNER_TEMP/maven-settings.xml"

      - name: Archive build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 https://github.com/actions/upload-artifact/releases/tag/v6.0.0
        with:
          name: cache-updater-lambda
          path: ./src/oneid/oneid-lambda-cache-updater/target/function.zip

  deploy:
    name: Deploy lambda cache-updater ${{ matrix.environment }}-${{ matrix.region }}
    if: ${{ needs.setup.outputs.matrix != '' }}
    runs-on: ubuntu-22.04
    needs: [setup, build]
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.environment }}-${{ matrix.region }}
      cancel-in-progress: false

    continue-on-error: false
    environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
    env:
      APP_NAME: ${{ fromJSON('{"dev":"oneid","uat":"oneid","prod":"oneid","io-uat":"oneid-io","io-prod/eu-south-1":"oneid-io","io-prod/eu-central-1":"oneid-io"}')[matrix.environment] }}
      ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p","io-uat":"u","io-prod/eu-south-1":"p","io-prod/eu-central-1":"p"}')[matrix.environment] }}
      REGION_SHORT: ${{ fromJSON('{"eu-south-1":"es-1","eu-central-1":"ec-1"}')[matrix.region] }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 https://github.com/actions/download-artifact/releases/tag/v7.0.0
        with:
          name: cache-updater-lambda
          path: ./src/oneid/oneid-lambda-cache-updater/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v6.0.0
        with:
          role-to-assume: ${{ vars.IAM_ROLE_DEPLOY_LAMBDA }}
          aws-region: ${{ matrix.region }}

      - name: Upload Lambda artifact (${{ matrix.environment }})
        run: |
          aws s3 cp src/oneid/oneid-lambda-cache-updater/target/function.zip s3://$LAMBDA_CODE_BUCKET_NAME/$LAMBDA_CACHE_UPDATER_KEY
        env:
          LAMBDA_CODE_BUCKET_NAME: ${{ vars.LAMBDA_CODE_BUCKET_NAME }}
          LAMBDA_CACHE_UPDATER_KEY: ${{ vars.LAMBDA_CACHE_UPDATER_KEY }}

      - name: Deploy Lambda function (${{ matrix.environment }})
        run: |
          aws lambda update-function-code \
          --function-name $APP_NAME-$REGION_SHORT-$ENV_SHORT-cache-updater \
          --s3-bucket $LAMBDA_CODE_BUCKET_NAME --s3-key $LAMBDA_CACHE_UPDATER_KEY
        env:
          REGION_SHORT: ${{ env.REGION_SHORT }}
          ENV_SHORT: ${{ env.ENV_SHORT }}
          LAMBDA_CODE_BUCKET_NAME: ${{ vars.LAMBDA_CODE_BUCKET_NAME }}
          LAMBDA_CACHE_UPDATER_KEY: ${{ vars.LAMBDA_CACHE_UPDATER_KEY }}
