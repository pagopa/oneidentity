name: plan
description: "Run terraform plan"

inputs:
  region:
    required: true
    type: string
  working-directory:
    required: true
    type: string
  iam_role:
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Read terraform version
      id: read-version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "TERRAFORM_VERSION=`cat "$GITHUB_WORKSPACE/src/infra/.terraform-version"`" >> $GITHUB_ENV

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v6.0.0
      with:
        role-to-assume: ${{ inputs.iam_role }}
        aws-region: ${{ inputs.region }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0 https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.0
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Format
      id: fmt
      shell: bash
      run: terraform fmt -check --recursive
      working-directory: ./src/infra

    - name: Package Lambda layers
      shell: bash
      run: ./scripts/package-lambda-layers.sh

    - name: Terraform Init
      id: init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        REPO_OWNER="pagopa" 
        REPO_NAME="terraform-module-integrity-checker"     
        RELEASE_TAG="1.2.0"         

        curl -L -o tf "https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/${RELEASE_TAG}/tf-linux"

        chmod +x tf

        sudo mv tf /usr/local/bin/tf  

        tf init

    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform plan -lock-timeout=60s
