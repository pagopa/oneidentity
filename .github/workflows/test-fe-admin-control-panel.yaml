name: Test Frontend Admin control panel

on:
  pull_request:
    paths:
      - "**/src/oneid/oneid-control-panel**"

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 https://github.com/actions/checkout/releases/tag/v5.0.0
      - name: Use Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 https://github.com/actions/setup-node/releases/tag/v5.0.0
        with:
          node-version: 20.x
      - name: Run yarn install, lint and test
        working-directory: src/oneid/oneid-control-panel
        run: |
          yarn install --frozen-lockfile
          yarn lint
          yarn test:coverage
